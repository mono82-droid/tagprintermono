<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="택번호">
<title>택번호 프린터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 상단 바: 제목 · 프린터 상태 · 되돌리기 · 설정 -->
  <header id="bar">
    <div class="bar-row">
      <h1>택번호 프린터</h1>
      <button id="status" class="chip" type="button"><span class="dot"></span><span id="statusText">프린터 연결 안 됨</span></button>
      <button id="undo" class="icon" type="button" aria-label="되돌리기">↶</button>
      <button id="redo" class="icon" type="button" aria-label="다시 하기">↷</button>
      <button id="gear" class="icon" type="button" aria-label="프린터 설정">⚙</button>
    </div>
    <div class="bar-row tabs-row">
      <div id="tabs" class="tabs"></div>
      <button id="recent" class="btn outline small" type="button">최근</button>
    </div>
  </header>

  <!-- 라벨 편집 영역 -->
  <section id="stage">
    <div id="paper">
      <canvas id="label"></canvas>
      <div id="sel" hidden></div>
      <div id="guideX" class="guide x" hidden></div>
      <div id="guideY" class="guide y" hidden></div>
    </div>
    <button id="sizeChip" class="sizechip" type="button">40×60mm ▾</button>
  </section>

  <!-- 글자 크기: 세로 화면에서도 항상 보이게 라벨 바로 아래 고정 -->
  <div id="quick" hidden>
    <button id="qMinus" class="btn outline" type="button">A−</button>
    <input id="qSize" type="range" min="2" max="160" step="1" aria-label="글자 크기">
    <button id="qPlus" class="btn outline" type="button">A+</button>
    <span id="qVal">12.0mm</span>
    <button id="qFill" class="btn tonal" type="button">꽉</button>
  </div>

  <!-- 가운데(스크롤): 편집 도구 + 속성 -->
  <main id="mid">
    <div class="card">
      <div class="sec first">라벨 종류</div>
      <div class="row" id="typeRow">
        <button class="btn tonal" data-type="TEXT" type="button">글자</button>
        <button class="btn tonal" data-type="SERIAL" type="button">연속번호</button>
        <button class="btn tonal" data-type="DATE" type="button">날짜</button>
      </div>
      <div class="hint">있으면 그 탭으로 이동, 없으면 새로 만듦 · 하나 더 만들 땐 위 ＋ · 길게 누르면 지금 라벨에 추가</div>
      <div class="sec">위치</div>
      <div class="row nudge">
        <button class="btn outline" data-nudge="-4,0" type="button">◀</button>
        <button class="btn outline" data-nudge="0,-4" type="button">▲</button>
        <button class="btn outline" data-nudge="0,4" type="button">▼</button>
        <button class="btn outline" data-nudge="4,0" type="button">▶</button>
        <button class="btn outline wide" id="centerH" type="button">↔ 중앙</button>
        <button class="btn outline wide" id="centerV" type="button">↕ 중앙</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn outline wider" id="lock" type="button">🔒 위치 고정</button>
        <button class="btn outline" id="dup" type="button">복제</button>
        <button class="btn danger" id="del" type="button">삭제</button>
      </div>
    </div>
    <div class="card" id="props"></div>
    <div class="foot">택번호 프린터 v1.5 · 아이폰은 Bluefy 앱에서 열어야 블루투스 프린터에 연결됩니다</div>
  </main>

  <!-- 하단 바: 다음 번호 · 장수 · 인쇄 -->
  <footer id="bottom">
    <div class="row" id="numberRow">
      <label class="f"><span>다음 번호</span><input id="next" class="field big" type="number" inputmode="numeric"></label>
      <label class="f count"><span>장수</span>
        <div class="row tight">
          <button class="btn outline" id="cMinus" type="button">−</button>
          <input id="count" class="field big" type="number" inputmode="numeric">
          <button class="btn outline" id="cPlus" type="button">+</button>
        </div>
      </label>
      <label class="f narrow"><span>&nbsp;</span><button class="btn ghost primaryText" id="numSet" type="button">번호<br>설정</button></label>
    </div>
    <div class="row">
      <button class="btn primary print" id="print" type="button">인쇄</button>
      <button class="btn outline side" id="reprint" type="button" disabled>다시</button>
      <button class="btn danger side" id="cancel" type="button" hidden>중지</button>
    </div>
    <div id="progress"></div>
  </footer>
</div>

<!-- 창(시트)과 알림 -->
<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog"></div>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
